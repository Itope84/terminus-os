name: android-apk
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK packages
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Gradle 8.7
        run: |
          cd /tmp && curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip && echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
      - working-directory: android
        run: gradle assembleDebug --no-daemon
      - working-directory: android
        run: find app/build/outputs -name "*.apk" 2>/dev/null || echo NO-APK-FOUND
      - uses: actions/upload-artifact@v4
        with:
          name: terminus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
