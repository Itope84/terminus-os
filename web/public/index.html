<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Terminus</title>
    <meta name="theme-color" content="#ECE7DA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1712" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terminus" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/icon-180.png" />
    <style id="expo-reset">
      html, body { height: 100%; background-color: #ECE7DA; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #1A1712; } }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; position: fixed; top: 0; left: 0; right: 0; height: 100%; height: 100dvh; }
      input:focus, textarea:focus { outline: none; }
    </style>
  </head>
  <body>
    <noscript>Terminus needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
