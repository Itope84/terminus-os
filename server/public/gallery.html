<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>artifacts</title>
<style>
:root{--bg:#F4EFE3;--surface:#FBF8F0;--sunk:#EDE6D6;--line:#E2DAC8;--ink:#262220;--mute:#6B645A;--faint:#8A8272;--accent:#3E6B4F;--chip:#E9E2D1;--bad:#C5483B;
--shadow:0 1px 2px rgba(38,34,32,.05),0 10px 24px -14px rgba(38,34,32,.22);--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1A1712;--surface:#24201B;--sunk:#2C2721;--line:#3A352E;--ink:#ECE7DA;--mute:#A89E8C;--faint:#8F8676;--accent:#8FC4A0;--chip:#35302A;--bad:#E37A6D;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.7)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:900px;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(96px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}[hidden]{display:none!important}
h1{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.15;margin:4px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sub{font-size:14px;color:var(--mute)}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}.iconbtn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.actions{display:flex;gap:8px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;margin:0 0 14px;position:sticky;top:max(8px,env(safe-area-inset-top));z-index:20;box-shadow:var(--shadow);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px)}
.tabs a,.tabs span{flex:1;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:14px;font-weight:600;color:var(--mute);text-decoration:none}
.tabs .on{background:var(--ink);color:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;padding:0 18px;outline:none;box-shadow:var(--shadow)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0 6px}.bar .search{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip b{font-weight:600;color:var(--faint);margin-left:5px}.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}.chip.on b{color:inherit;opacity:.65}
.group{margin:0 0 6px}
.gh{position:sticky;top:calc(max(8px,env(safe-area-inset-top)) + 62px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px 8px;background:linear-gradient(var(--bg) 78%,transparent);min-height:44px;border:0;width:100%;text-align:left}
.gh h2{margin:0;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.gh span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}.gh i{display:inline-block;transition:transform .2s;margin-left:6px;font-style:normal}.group.closed .gh i{transform:rotate(-90deg)}
.group.closed .items{display:none}
.items.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);padding:0;display:block;width:100%;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile:active{transform:scale(.985)}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .shade{position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none;opacity:.0;transition:opacity .2s}
.tile .cap{position:absolute;left:8px;right:8px;bottom:6px;color:#fff;font-size:11.5px;line-height:1.25;text-align:left;text-shadow:0 1px 2px rgba(0,0,0,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.tile.has-shade .shade{opacity:1}
.tile.doc{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;background:var(--surface);text-align:left}
.badge{font-size:11px;font-weight:750;letter-spacing:.05em;color:var(--ink);background:var(--chip);border-radius:9px;padding:3px 8px}
.badge.k-pdf{background:#F1D9D3;color:#8A2D20}.badge.k-audio{background:#E3DCF2;color:#4F3E8A}.badge.k-text{background:#DCE8DF;color:#2B5A3C}.badge.k-sheet{background:#D9EBDD;color:#1E6A3A}.badge.k-zip{background:#EBE0C6;color:#6B5320}
@media (prefers-color-scheme:dark){.badge.k-pdf{background:#4A2A25;color:#F2B5AA}.badge.k-audio{background:#34304F;color:#C6BAF0}.badge.k-text{background:#2A3E31;color:#A9D8B8}.badge.k-sheet{background:#244030;color:#9BD8AE}.badge.k-zip{background:#40371F;color:#E5CF93}}
.doc .nm{font-size:13px;font-weight:650;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;width:100%}
.doc .mt{font-size:11.5px;color:var(--faint);margin-top:2px}
.play{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;pointer-events:none}.play svg{width:12px;height:12px;fill:#fff;margin-left:2px}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.chk{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:none;place-items:center;color:#fff}
.selecting .chk{display:grid}.tile.sel{outline:3px solid var(--accent);outline-offset:-3px}.tile.sel .chk{background:var(--accent);border-color:var(--accent)}
.chk svg{width:14px;height:14px;opacity:0}.tile.sel .chk svg{opacity:1}.selecting .dot{display:none}
.items.list{display:flex;flex-direction:column;gap:8px}
.list .tile{aspect-ratio:auto;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--surface);text-align:left}
.list .tile .th{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none;background:var(--sunk);display:grid;place-items:center}
.list .tile .th img,.list .tile .th video{width:100%;height:100%;object-fit:cover}
.list .tile .meta{min-width:0;flex:1}.list .tile .meta b{display:block;font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list .tile .meta span{font-size:12.5px;color:var(--faint)}
.list .tile .chk{position:static;flex:none}.list .tile .dot{position:static;flex:none;box-shadow:none}.list .tile .shade,.list .tile .cap,.list .tile .play{display:none}
.dirrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left;font-size:15px;font-weight:600}.dirrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dirrow .c{color:var(--faint);font-weight:500;font-size:13px}.dirrow:active{transform:scale(.99)}
.crumb{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.crumb span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.skeleton{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.skeleton i{aspect-ratio:1;border-radius:16px;background:linear-gradient(90deg,var(--sunk) 25%,var(--surface) 50%,var(--sunk) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mute);padding:44px 18px;border:1px dashed var(--line);border-radius:20px;margin-top:8px}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.banner{background:var(--sunk);border:1px solid var(--line);color:var(--mute);border-radius:14px;padding:10px 14px;margin:8px 0;font-size:14px}.banner.bad{color:var(--ink);background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.uploads{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.up{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;box-shadow:var(--shadow)}.up .r{display:flex;justify-content:space-between;gap:10px}.up .r b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .pb{height:5px;border-radius:99px;background:var(--sunk);margin-top:8px;overflow:hidden}.up .pb i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.up.err{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}.up.err .r span{color:var(--bad)}
.foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--faint)}
.auth{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;margin-top:16px}.auth h2{margin:0 0 4px;font-size:20px}.auth p{margin:0 0 14px;color:var(--mute);font-size:14px}.auth .search{margin-bottom:10px}
.btn{min-height:48px;border-radius:999px;border:0;background:var(--ink);color:var(--surface);font-weight:650;padding:0 22px}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--bad);color:#fff}.btn:disabled{opacity:.5}
.selbar{position:fixed;left:50%;transform:translate(-50%,120%);bottom:max(14px,env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--ink);color:var(--surface);box-shadow:0 12px 32px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 24px)}
.selbar.on{transform:translate(-50%,0)}.selbar .n{font-weight:650;margin-right:6px;white-space:nowrap}.selbar button{min-height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:inherit;font-weight:650}.selbar button.del{background:var(--bad);color:#fff}
.drop{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;place-items:center;font-size:22px;font-weight:700;border:3px dashed var(--accent);margin:10px;border-radius:26px}.drop.on{display:grid}
/* lightbox */
#lb{position:fixed;inset:0;z-index:100;background:#0B0A09;color:#fff;display:none;flex-direction:column;touch-action:pan-y}#lb.on{display:flex}
#lb .tb,#lb .bb{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:3;background:linear-gradient(rgba(0,0,0,.62),transparent);transition:opacity .2s}
#lb .tb{top:0;padding-top:max(10px,env(safe-area-inset-top))}#lb .bb{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.62));justify-content:center}
#lb.chromeoff .tb,#lb.chromeoff .bb{opacity:0;pointer-events:none}
#lb .tt{flex:1;min-width:0}#lb .tt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lb .tt span{font-size:12px;opacity:.7}
#lb .lbtn{min-width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:600;font-size:14px}#lb .lbtn svg{width:19px;height:19px}#lb .lbtn.del{background:rgba(197,72,59,.9)}
#lb .stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
#lb .stage img,#lb .stage video{max-width:100%;max-height:100%;object-fit:contain}
#lb .stage audio{width:min(420px,86vw)}#lb .stage pre{margin:0;align-self:stretch;overflow:auto;padding:76px 18px 90px;width:100%;font:13px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#E8E3D8}
#lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;z-index:3;display:none}#lb .nv.l{left:10px}#lb .nv.r{right:10px}
@media (hover:hover) and (min-width:700px){#lb .nv{display:block}}
#lb .gen{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px}#lb .gen .badge{font-size:16px;padding:8px 16px}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:20px;width:min(380px,calc(100vw - 32px));box-shadow:0 20px 60px #0006}dialog::backdrop{background:#0008}
dialog h3{margin:0 0 6px;font-size:18px}dialog p{margin:0 0 14px;color:var(--mute);font-size:14px}.btns{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:max(84px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:calc(100vw - 32px);text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
#ptr{text-align:center;font-size:12px;color:var(--mute);height:0;overflow:hidden;transition:height .15s}#ptr.show{height:26px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mobile .tabs{display:none}.mobile .gh{top:0}
#lb #lbclose{padding:0;width:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="ptr">↓ pull to refresh</div>
<header class="top">
  <div><h1>artifacts</h1><div class="sub" id="summary">&nbsp;</div></div>
  <div class="actions">
    <button class="iconbtn" id="viewbtn" aria-label="Toggle grid or list" title="Grid / list"></button>
    <button class="iconbtn" id="repobtn" aria-label="Repo browser" title="Repo browser" hidden>&lt;/&gt;</button>
    <button class="iconbtn" id="bookbtn" aria-label="Notebook files" title="Notebook" hidden></button>
    <button class="iconbtn" id="sharebtn" aria-label="Shared files" title="Shared" hidden></button>
    <button class="iconbtn primary" id="upbtn" aria-label="Upload files" title="Upload"></button>
  </div>
</header>
<nav class="tabs" id="tabs"><span class="on">artifacts</span><a href="/ops">ops</a><a href="/notes">notes</a><a href="/skills">skills</a></nav>
<input type="file" id="file" multiple hidden>
<div class="bar"><input class="search" id="q" type="search" placeholder="search files…" autocomplete="off" enterkeyhint="search"><button class="iconbtn" id="refresh" aria-label="Refresh" title="Refresh"></button></div>
<div class="chips" id="chips"></div>
<div id="banner"></div>
<div class="uploads" id="uploads"></div>
<main id="main"><div class="skeleton"><i></i><i></i><i></i><i></i><i></i><i></i></div></main>
<div class="foot" id="foot"></div>

<div class="selbar" id="selbar"><span class="n" id="seln"></span><button id="selall">All</button><button id="seldl">Download</button><button class="del" id="seldel">Delete</button><button id="selx" aria-label="Cancel selection">✕</button></div>
<div class="drop" id="drop">Drop to upload</div>
<div class="toast" id="toast"></div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Preview">
  <div class="tb"><button class="lbtn" id="lbclose" aria-label="Close"></button><div class="tt"><b id="lbname"></b><span id="lbmeta"></span></div></div>
  <button class="nv l" id="lbprev" aria-label="Previous">‹</button><button class="nv r" id="lbnext" aria-label="Next">›</button>
  <div class="stage" id="stage"></div>
  <div class="bb"><button class="lbtn" id="lbdl"></button><button class="lbtn" id="lbshare"></button><button class="lbtn" id="lbopen"></button><button class="lbtn del" id="lbdel"></button></div>
</div>

<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgB"></p><div class="btns"><button class="btn ghost" id="dlgNo">Cancel</button><button class="btn danger" id="dlgGo">Delete</button></div></dialog>

<script>
(function(){
'use strict';
var Q=new URLSearchParams(location.search);
if(Q.get('mobile'))document.body.classList.add('mobile');
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var ICON={
 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 10l5-5 5 5M5 19h14"/></svg>',
 refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
 share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"/></svg>',
 open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M5 17a2 2 0 0 1 2-2h11"/></svg>',
 users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.5c2 .5 4 1.9 4 4"/></svg>'
};
$('upbtn').innerHTML=ICON.up;$('refresh').innerHTML=ICON.refresh;$('lbclose').innerHTML=ICON.close;
$('bookbtn').innerHTML=ICON.book;$('sharebtn').innerHTML=ICON.users;
$('lbdl').innerHTML=ICON.dl+'<span>Save</span>';$('lbshare').innerHTML=ICON.share+'<span>Share</span>';$('lbopen').innerHTML=ICON.open+'<span>Open</span>';$('lbdel').innerHTML=ICON.trash;

/* ---------- auth + api ---------- */
var token='',tokenBad=false;
try{token=(localStorage.getItem('terminus-token')||'').trim()}catch(e){}
var qTok=(Q.get('token')||'').trim();

function fileUrl(path,extra){var u=path;var qs=[];if(token)qs.push('token='+encodeURIComponent(token));if(extra)qs.push(extra);return qs.length?u+(u.indexOf('?')<0?'?':'&')+qs.join('&'):u}

/* ---------- model ---------- */
var S={mode:'files',repo:[],cwd:[],files:[],filter:'all',q:'',view:'grid',sel:{},selecting:false,closed:{},retention:0,loaded:false,seenAtLoad:0,lb:-1,vis:[],only:null};
try{S.view=localStorage.getItem('tm-gal-view')==='list'?'list':'grid';S.seenAtLoad=Number(localStorage.getItem('tm-gal-seen')||0)||0;S.closed=JSON.parse(localStorage.getItem('tm-gal-closed')||'{}')||{}}catch(e){}
var EXT={img:'png jpg jpeg gif webp avif bmp svg heic heif',vid:'mp4 mov m4v webm mkv avi',aud:'mp3 m4a wav aac ogg opus flac',pdf:'pdf',txt:'txt md markdown log json csv tsv yml yaml xml html htm js mjs cjs ts tsx jsx py sh css toml kt kts java rs go rb php swift gradle properties ini conf env gitignore',sheet:'xls xlsx ods csv',zip:'zip tar gz tgz 7z rar'};
function extOf(n){var i=n.lastIndexOf('.');return i<0?'':n.slice(i+1).toLowerCase()}
function kindOf(n){var e=extOf(n);function has(k){return (' '+EXT[k]+' ').indexOf(' '+e+' ')>=0}
 if(has('img'))return 'image';if(has('vid'))return 'video';if(has('aud'))return 'audio';if(e==='pdf')return 'pdf';if(has('zip'))return 'zip';if(e==='xls'||e==='xlsx'||e==='ods')return 'sheet';if(has('txt'))return 'text';return 'other'}
var GROUPS={all:'All',image:'Images',video:'Video',audio:'Audio',doc:'Docs',other:'Other'};
function bucket(k){return k==='image'||k==='video'||k==='audio'?k:(k==='pdf'||k==='text'||k==='sheet')?'doc':'other'}
function bytes(n){if(n==null)return '';var u=['B','KB','MB','GB'],i=0;while(n>=1024&&i<3){n/=1024;i++}return (i&&n<10?n.toFixed(1):Math.round(n))+'\u00a0'+u[i]}
function ago(t){if(!t)return '';var s=Date.now()/1000-t;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<172800)return 'yesterday';return Math.floor(s/86400)+'d ago'}
function dayLabel(f){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(f);if(!m)return f==='older'?'Older':f.charAt(0).toUpperCase()+f.slice(1);
 var d=new Date(+m[1],+m[2]-1,+m[3]),now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),diff=Math.round((t0-d)/86400000);
 if(diff===0)return 'Today';if(diff===1)return 'Yesterday';return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}

function ingest(j){
 var out=[],folders=j.folders||{};
 Object.keys(folders).forEach(function(f){(folders[f]||[]).forEach(function(it){
  var path;try{path=new URL(it.u,location.href).pathname}catch(e){path=it.u}
  var rel=decodeURIComponent(path.replace(/^\/terminus\//,'')),name=rel.split('/').pop();
  var k=kindOf(name),disp=name;
  if(/^rec-.*\.m4a$/i.test(name)){var d=new Date((it.t||0)*1000);disp='Recording · '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  else{var sub=rel.split('/').slice(1,-1).join('/');if(sub)disp=sub+'/'+name}
  out.push({path:path,rel:rel,name:name,disp:disp,folder:f,size:it.s||0,t:it.t||0,kind:k,bucket:bucket(k),ext:extOf(name)})})});
 out.sort(function(a,b){return b.t-a.t});S.files=out;S.retention=j.retentionDays||0;
}
var loading=null;
function load(manual){
 if(loading)return loading;
 if(manual)$('refresh').style.opacity='.5';
 loading=fetch('/terminus',{headers:hdr({'Accept':'application/json'}),cache:'no-store'}).then(function(r){
  if(r.status===401||r.status===403){if(token){tokenBad=true;setTok('')}showAuth();throw new Error('auth')}
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
  ingest(j);S.loaded=true;tokenBad=false;$('banner').innerHTML='';loadRepo();if(S.lb<0)render();
  var newest=S.files.length?S.files[0].t:0;try{if(newest>S.seenAtLoad)localStorage.setItem('tm-gal-seen',String(newest))}catch(e){}
  if(manual)toast('Up to date')}).catch(function(e){
  if(e&&e.message==='auth')return;
  $('banner').innerHTML='<div class="banner bad">Can’t reach the server ('+esc(e.message||'offline')+'). '+(S.loaded?'Showing what was loaded.':'')+' <button class="chip" id="retry">Retry</button></div>';
  var rt=$('retry');if(rt)rt.onclick=function(){load(true)};
  if(!S.loaded)$('main').innerHTML=''}).then(function(){loading=null;$('refresh').style.opacity=''},function(){loading=null});
 return loading}

function showAuth(){
 $('main').innerHTML='<div class="auth"><h2>Unlock artifacts</h2><p>'+(tokenBad?'That token didn’t work. Paste it again to unlock.':'This gallery is private. Paste the access token to unlock it.')+'</p><input class="search" id="pw" type="password" autocomplete="current-password" placeholder="access token"><div id="autherr" class="sub" style="color:var(--bad);min-height:20px"></div><button class="btn" id="go">Unlock</button></div>';
 $('chips').innerHTML='';$('summary').textContent='locked';
 function go(){var v=$('pw').value.trim();if(!v)return;$('go').disabled=true;
  loginReq(v).then(function(r){
   if(!r.ok)throw new Error('wrong token');setTok(v);tokenBad=false;load()}).catch(function(e){$('go').disabled=false;$('autherr').textContent=e.message||'failed'})}
 $('go').onclick=go;$('pw').onkeydown=function(e){if(e.key==='Enter')go()}}

/* Notebook files live behind their own button, never in the main list. */
var OWN_VIEW={'notebook-data':1};
function mainFiles(){return S.files.filter(function(f){return !OWN_VIEW[f.folder]})}

function tileHtml(f,i,viewOverride){
 var view=viewOverride||S.view;var u=fileUrl(f.path),sel=S.sel[f.path]?' sel':'',isNew=f.t>S.seenAtLoad&&S.seenAtLoad>0;
 var chk='<span class="chk">'+ICON.check+'</span>',dot=isNew?'<span class="dot" title="new"></span>':'';
 var meta=[f.size==null?'':bytes(f.size),ago(f.t)].filter(Boolean).join(' · ');
 if(view==='list'){
  var th=f.kind==='image'?'<img loading="lazy" decoding="async" alt="" src="'+esc(u)+'">':f.kind==='video'?'<video muted preload="metadata" playsinline src="'+esc(fileUrl(f.path,''))+'#t=0.1"></video>':'<span class="badge k-'+f.kind+'">'+esc((f.ext||'file').slice(0,4).toUpperCase())+'</span>';
  return '<button class="tile'+sel+'" data-i="'+i+'"><span class="th">'+th+'</span><span class="meta"><b>'+esc(f.disp||f.name)+'</b><span>'+(meta||esc(f.ext||'file'))+'</span></span>'+dot+chk+'</button>'}
 if(f.kind==='image')return '<button class="tile has-shade'+sel+'" data-i="'+i+'" aria-label="'+esc(f.disp||f.name)+'"><img loading="lazy" decoding="async" alt="" src="'+esc(u)+'"><span class="shade"></span><span class="cap">'+esc(f.disp||f.name)+'</span>'+dot+chk+'</button>';
 if(f.kind==='video')return '<button class="tile has-shade'+sel+'" data-i="'+i+'" aria-label="'+esc(f.name)+'"><video muted preload="metadata" playsinline src="'+esc(u)+'#t=0.1"></video><span class="play">'+ICON.play+'</span><span class="shade"></span><span class="cap">'+esc(f.disp||f.name)+'</span>'+dot+chk+'</button>';
 return '<button class="tile doc'+sel+'" data-i="'+i+'" aria-label="'+esc(f.name)+'"><span class="badge k-'+f.kind+'">'+esc((f.ext||'file').slice(0,4).toUpperCase())+'</span><span><span class="nm" style="display:-webkit-box">'+esc(f.disp||f.name)+'</span><span class="mt" style="display:block">'+bytes(f.size)+'</span></span>'+dot+chk+'</button>'}

function render(){

}

/* ---------- repo browser (read-only, tracked files) ---------- */
function loadRepo(){fetch('/api/repo-tree',{headers:hdr(),cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
 if(j&&j.files){S.repo=j.files;$('repobtn').hidden=!S.repo.length;if(S.mode==='repo'&&S.lb<0)render()}}).catch(function(){})}
function repoObj(rel){var name=rel.split('/').pop(),k=kindOf(name);return {path:'/repo/'+rel.split('/').map(encodeURIComponent).join('/'),rel:rel,name:name,disp:name,folder:'repo',size:null,t:0,kind:k,bucket:bucket(k),ext:extOf(name),ro:true}}

 var prefix=S.cwd.length?S.cwd.join('/')+'/':'',q=S.q.toLowerCase(),dirs=[],seen={},files=[];
 S.repo.forEach(function(rel){if(rel.indexOf(prefix)!==0)return;var rest=rel.slice(prefix.length),sl=rest.indexOf('/');
  if(q){if(rel.toLowerCase().indexOf(q)>=0){var o=repoObj(rel);o.disp=rel;files.push(o)}return}
  if(sl>=0){var d=rest.slice(0,sl);if(!seen[d]){seen[d]=1;dirs.push(d)}}else files.push(repoObj(rel))});
 dirs.sort();files.sort(function(a,b){return a.disp.localeCompare(b.disp)});S.vis=files;
 $('chips').innerHTML='';$('summary').textContent='repo · '+S.repo.length+' tracked files';$('foot').textContent='Read-only view of the files git tracks.';
 var h='<div class="crumb"><button class="chip" id="repoback">← '+(S.cwd.length?'back':'artifacts')+'</button><span>terminus/'+esc(S.cwd.join('/'))+'</span></div>';
 h+=dirs.map(function(d){return '<button class="dirrow" data-d="'+esc(d)+'"><span>📁</span><span class="n">'+esc(d)+'</span><span class="c">›</span></button>'}).join('');
 if(files.length)h+='<div class="items list">'+files.map(function(f,i){return tileHtml(f,i,'list')}).join('')+'</div>';
 if(!dirs.length&&!files.length)h+='<div class="empty"><b>Nothing here</b>'+(q?'No tracked files match.':'This folder is empty.')+'</div>';
 $('main').innerHTML=h;updateSel()}

 pressT=setTimeout(function(){pressed=true;var i=+t.getAttribute('data-i');toggleSel(i,true);if(navigator.vibrate)try{navigator.vibrate(12)}catch(x){}},450)});

 if(S.sel[f.path])delete S.sel[f.path];else S.sel[f.path]=f;S.selecting=Object.keys(S.sel).length>0||!!force;
 if(!Object.keys(S.sel).length)S.selecting=false;render()}

 else if(f.kind==='video'){st.innerHTML='<video controls autoplay playsinline src="'+esc(u)+'"></video>'}

 else if(f.kind==='text'||f.kind==='sheet'&&f.ext==='csv'){st.innerHTML='<pre>loading…</pre>';fetch(f.path,{headers:hdr()}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()}).then(function(b){if(b.size>200*1024)throw new Error('too large to preview (use Save or Open)');return b.text()}).then(function(t){if(S.vis[S.lb]&&S.vis[S.lb].path===f.path){var p=st.querySelector('pre');if(p)p.textContent=t}}).catch(function(e){var p=st.querySelector('pre');if(p)p.textContent='Can’t preview: '+(e.message||'error')})}
 else{st.innerHTML='<div class="gen"><span class="badge k-'+f.kind+'">'+esc((f.ext||'file').toUpperCase())+'</span><div>No preview for this file type.</div></div>'}
 $('lbprev').style.visibility=S.lb>0?'':'hidden';$('lbnext').style.visibility=S.lb<S.vis.length-1?'':'hidden';

var sx=null,sy=null,moved=false;
$('stage').addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;moved=false});
$('stage').addEventListener('pointermove',function(e){if(sx!==null&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))moved=true});
$('stage').addEventListener('pointerup',function(e){if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){step(dx<0?1:-1);return}
 if(Math.abs(dy)>110&&dy>0&&Math.abs(dy)>Math.abs(dx)*1.6){closeLb();return}
 if(!moved&&e.target.tagName!=='VIDEO'&&e.target.tagName!=='AUDIO'){chrome=!chrome;$('lb').classList.toggle('chromeoff',!chrome)}});
document.addEventListener('keydown',function(e){if(S.lb<0)return;if(e.key==='Escape')closeLb();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});

/* ---------- upload ---------- */
var UPMAX=50*1024*1024;
function uid(){try{return crypto.randomUUID()}catch(e){return 'u'+Date.now()+Math.random().toString(16).slice(2)}}
function upload(files){
 files.forEach(function(f){
  var row=document.createElement('div');row.className='up';row.innerHTML='<div class="r"><b>'+esc(f.name)+'</b><span>queued</span></div><div class="pb"><i></i></div>';$('uploads').appendChild(row);
  var st=row.querySelector('span'),bar=row.querySelector('.pb i');
  function fail(m){row.classList.add('err');st.textContent=m;row.querySelector('.pb').remove();setTimeout(function(){row.remove()},7000)}
  if(f.size>UPMAX)return fail('over 50 MB');
  var x=new XMLHttpRequest();x.open('POST','/terminus?filename='+encodeURIComponent(f.name));
  if(token)x.setRequestHeader('Authorization','Bearer '+token);x.setRequestHeader('X-Upload-Id',uid());x.setRequestHeader('Content-Type',f.type||'application/octet-stream');
  x.upload.onprogress=function(e){if(e.lengthComputable){var p=Math.round(100*e.loaded/e.total);bar.style.width=p+'%';st.textContent=p+'%'}};
  x.onload=function(){if(x.status>=200&&x.status<300){bar.style.width='100%';st.textContent='done';setTimeout(function(){row.remove()},1200);load()}
   else if(x.status===403)fail('uploads are locked');else if(x.status===401)fail('not signed in');else if(x.status===413)fail('too large');else fail('failed ('+x.status+')')};
  x.onerror=function(){fail('network error')};x.send(f)})}
var dragN=0;
document.addEventListener('dragenter',function(e){if(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types||[],'Files')>=0){dragN++;$('drop').classList.add('on')}});
document.addEventListener('dragleave',function(){dragN=Math.max(0,dragN-1);if(!dragN)$('drop').classList.remove('on')});
document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){e.preventDefault();dragN=0;$('drop').classList.remove('on');if(e.dataTransfer&&e.dataTransfer.files.length)upload([].slice.call(e.dataTransfer.files))});

/* ---------- misc ---------- */
var tt=null;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2200)}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.lb<0)load()});
var py=null;document.addEventListener('touchstart',function(e){if(window.scrollY===0&&S.lb<0)py=e.touches[0].clientY},{passive:true});
document.addEventListener('touchmove',function(e){if(py===null)return;var d=e.touches[0].clientY-py;$('ptr').classList.toggle('show',d>12);$('ptr').textContent=d>80?'↓ release to refresh':'↓ pull to refresh'},{passive:true});
document.addEventListener('touchend',function(){if($('ptr').classList.contains('show')&&$('ptr').textContent.indexOf('release')>=0)load(true);$('ptr').classList.remove('show');py=null});
function boot(){
 var go=function(){render();load()};
 if(qTok){setTok(qTok);stripTok();loginReq(qTok).catch(function(){}).then(go)}else go()}
boot();
setInterval(function(){if(!document.hidden&&S.lb<0&&!S.selecting)load()},45000);
})();
</script>
</body>
</html>
